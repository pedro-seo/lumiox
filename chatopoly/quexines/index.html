<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Quexinopoly 3D</title>
<meta name="description" content="Monopoly en 3D con el lore del grupo QUEXINES: Villa Jávea, Motorsportive, el Garitaso de NanoCasas, EFS y UADB.">
<style>
:root{
  --bg:#eef1ea; --surface:rgba(255,253,247,.94); --solid:#fffdf7; --ink:#18201b; --muted:#667066; --line:#d8d6c8;
  --accent:#0f8a55; --accent-ink:#fff; --danger:#c0392b; --scene:#cfdcd2;
  --shadow:0 2px 6px rgba(0,0,0,.08),0 12px 32px rgba(0,0,0,.12);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b1210; --surface:rgba(20,27,24,.92); --solid:#18201c; --ink:#ecf1ec; --muted:#9aa59c; --line:#2d3833;
    --accent:#2fd083; --accent-ink:#04150c; --danger:#ef7a6d; --scene:#0d1613;
    --shadow:0 2px 6px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  --bg:#0b1210; --surface:rgba(20,27,24,.92); --solid:#18201c; --ink:#ecf1ec; --muted:#9aa59c; --line:#2d3833;
  --accent:#2fd083; --accent-ink:#04150c; --danger:#ef7a6d; --scene:#0d1613;
  --shadow:0 2px 6px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
h1,h2,h3{margin:0 0 .45em;line-height:1.15}
h3{font-size:.95rem}
button{appearance:none;border:1px solid var(--line);background:var(--solid);color:var(--ink);font:inherit;font-weight:650;padding:9px 13px;border-radius:10px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;justify-content:center}
button:hover:not(:disabled){border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button:disabled{opacity:.45;cursor:not-allowed}
input[type=text],input[type=number]{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%}
.muted{color:var(--muted)} .small{font-size:.82rem}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

.app{display:flex;height:100vh;height:100dvh}
.stage{position:relative;flex:1;min-width:0}
#c{display:block;width:100%;height:100%;touch-action:none}
.hud{width:360px;flex:none;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:10px;border-left:1px solid var(--line);background:var(--bg)}
@media (max-width:820px){
  .app{flex-direction:column}
  .stage{flex:none;height:58vh;height:58dvh}
  .hud{width:auto;flex:1;border-left:0;border-top:1px solid var(--line);padding:10px 12px 18px}
  .brand{display:none}
}
.card{background:var(--solid);border:1px solid var(--line);border-radius:14px;padding:13px}
.tools{position:absolute;top:10px;left:10px;display:flex;gap:6px;flex-wrap:wrap;z-index:5}
.tools button{background:var(--surface);backdrop-filter:blur(6px);padding:7px 10px;font-size:.82rem}
.tools button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.brand{position:absolute;right:12px;top:10px;font-weight:900;letter-spacing:.02em;font-size:1rem;background:var(--surface);padding:6px 11px;border-radius:10px;border:1px solid var(--line);z-index:5}
.toast{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);padding:8px 14px;border-radius:99px;font-weight:700;z-index:6;transition:opacity .3s;pointer-events:none;max-width:calc(100% - 32px);text-align:center}

.turn{display:flex;align-items:center;gap:10px}
.chip{width:22px;height:22px;border-radius:6px;flex:none;box-shadow:inset 0 0 0 2px rgba(255,255,255,.5)}
.turn .money{margin-left:auto;font-weight:800;font-size:1.15rem;font-variant-numeric:tabular-nums}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.actions button{flex:1 1 auto}
.pl{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:10px;border:1px solid var(--line);margin-bottom:6px;cursor:default}
.pl.active{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
.pl.out{opacity:.4;text-decoration:line-through}
.pl .nm{flex:1;min-width:0;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl .mn{font-weight:800;font-variant-numeric:tabular-nums}
.log{max-height:210px;overflow:auto;font-size:.82rem}
.log div{padding:3px 0;border-bottom:1px dashed var(--line)}
.band{height:10px;border-radius:4px;margin-bottom:8px}
.detail table{width:100%;font-size:.82rem;border-collapse:collapse}
.detail td{padding:2px 0}
.detail td:last-child{text-align:right;font-variant-numeric:tabular-nums}
.quote{font-style:italic;color:var(--muted);font-size:.85rem;margin:0 0 8px}
.build .it{display:flex;align-items:center;gap:6px;font-size:.84rem;margin-top:6px}
.build .it span{flex:1;min-width:0}
.build .it .sw{flex:none;width:10px;height:10px;border-radius:2px}
.build .it button{padding:4px 9px}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;z-index:20;padding:16px}
.mbox{background:var(--solid);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:20px;width:min(460px,100%);max-height:calc(100dvh - 32px);overflow:auto;animation:pop .28s ease-out}
@keyframes pop{from{transform:scale(.92) translateY(8px);opacity:0}to{transform:none;opacity:1}}
.gcard{border-radius:14px;overflow:hidden;border:1px solid var(--line);animation:flip .5s ease-out;transform-origin:center}
@keyframes flip{from{transform:perspective(700px) rotateY(90deg)}to{transform:perspective(700px) rotateY(0)}}
.gcard .hd{padding:12px 16px;color:#fff;font-weight:900;letter-spacing:.04em;display:flex;gap:8px;align-items:center}
.gcard .bd{padding:16px}
.gcard .fx{font-weight:800;font-size:1.05rem;margin-top:10px}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;margin:8px 0}
.pick label{display:flex;gap:8px;align-items:center;padding:4px 0}
.setup h1{font-size:1.6rem;font-weight:900;letter-spacing:-.01em}
.lore{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0 12px}
.lore span{font-size:.75rem;padding:2px 8px;border-radius:99px;border:1px solid var(--line)}
.winner{font-size:1.5rem;font-weight:900;text-align:center;margin:8px 0}
</style>
</head>

</div>
<div class="modal" id="modal" hidden><div class="mbox" id="mbox"></div></div>

function wrap(ctx, text, maxW, maxLines) {

  }
  if (line) lines.push(line);
  if (lines.length > maxLines) { lines.length = maxLines; lines[maxLines - 1] += '…'; }
  return lines.map(l => { while (ctx.measureText(l).width > maxW && l.length > 2) l = l.slice(0, -2) + '…'; return l; });
}

const tweens = new Set();
let SPEED = 1;
function tween(dur, fn) { return new Promise(res => tweens.add({ t0: performance.now(), dur: dur * SPEED, fn, res })); }
const easeOut = t => 1 - Math.pow(1 - t, 3), easeInOut = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const angLerp = (a, b, t) => { let d = ((b - a + Math.PI) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2) - Math.PI; return a + d * t; };
const wait = ms => new Promise(r => setTimeout(r, ms));

async function throwDice(vals) {
  await Promise.all(dice.map((d, k) => {
    const [fx, fz] = faceEuler(vals[k]), yaw = Math.random() * Math.PI * 2;
    const spin = () => (Math.random() < .5 ? -1 : 1) * Math.PI * 2 * (1 + rand(3));
    const r0 = { x: fx + spin(), y: yaw + spin(), z: fz + spin() };
    const p0 = new THREE.Vector3(3.2 - k * 0.5, 2.8, -0.5 + k * 0.6), p1 = new THREE.Vector3(-0.9 + k * 0.75 + (Math.random() - .5) * .3, 0.21, 1.15 + (Math.random() - .5) * .4);
    return tween(1150 + k * 90, t => {
      const e = easeOut(t);
      d.position.lerpVectors(p0, p1, e);
      d.position.y = t < .55 ? 0.21 + 2.6 * (1 - (t / .55) ** 2) : t < .82 ? 0.21 + 0.32 * Math.sin(((t - .55) / .27) * Math.PI) : 0.21 + 0.07 * Math.sin(((t - .82) / .18) * Math.PI);
      d.rotation.set(r0.x + (fx - r0.x) * e, r0.y + (yaw - r0.y) * e, r0.z + (fz - r0.z) * e);
    });
  }));
}
async function hop(pi, to, dur = 190) {
  const car = cars[pi], p0 = car.position.clone(), p1 = slotPos(to, pi), a0 = car.rotation.y;
  const dir = p1.clone().sub(p0), a1 = dir.lengthSq() > 1e-4 ? Math.atan2(-dir.x, -dir.z) : a0;
  await tween(dur, t => {
    car.position.lerpVectors(p0, p1, t); car.position.y = Math.sin(t * Math.PI) * 0.28;
    car.rotation.y = angLerp(a0, a1, Math.min(1, t * 2));
  });

}
async function animateSteps(pi, from, steps, dur) {
  const dir = Math.sign(steps);
  for (let k = 0, at = from; k < Math.abs(steps); k++) { at = (at + dir + 40) % 40; await hop(pi, at, dur); }
  const car = cars[pi], to = (from + steps + 40) % 40, target = HEADING[Math.floor(to / 10)] + (dir < 0 ? Math.PI : 0);
  const a0 = car.rotation.y; await tween(160, t => { car.rotation.y = angLerp(a0, target, t); });
}
async function flyTo(pi, to) {
  const car = cars[pi], p0 = car.position.clone(), p1 = slotPos(to, pi), a0 = car.rotation.y;
  await tween(800, t => {
    const e = easeInOut(t); car.position.lerpVectors(p0, p1, e); car.position.y = Math.sin(t * Math.PI) * 2.2;
    car.rotation.y = a0 + t * Math.PI * 4;
  });
  car.position.y = 0; car.rotation.y = HEADING[Math.floor(to / 10)];
}

let G = null, busy = false, buildOpen = false, detailIdx = null, winnerShown = false;
const cur = () => G.players[G.turn];
function log(t) { G.log.unshift(t); G.log.length = Math.min(G.log.length, 120); }
function save() { if (G) store.set(SAVE_KEY, G); }
function toast(t) { const el = $('#toast'); el.textContent = t; el.style.opacity = 1; clearTimeout(toast.h); toast.h = setTimeout(() => { el.style.opacity = 0; }, 2200); }

function newGame(names) {
  return {
    players: names.map((n, i) => ({ name: n, color: TEAMS[i].c, team: TEAMS[i].team, money: 1500, pos: 0, inJail: false, jailTurns: 0, free: 0, out: false })),
    owner: {}, houses: {}, turn: 0, phase: 'roll', doubles: 0, lastDouble: false, dice: [1, 1], log: [],
    decks: { ch: shuffle([...CARDS.ch.keys()]), cc: shuffle([...CARDS.cc.keys()]) }, deckPos: { ch: 0, cc: 0 }, offer: null, winner: null,
  };
}
function buildCars() {
  cars.forEach(c => scene.remove(c)); cars.length = 0;
  G.players.forEach((p, k) => {
    const c = makeCar(p.color); c.position.copy(slotPos(p.pos, k)); c.rotation.y = HEADING[Math.floor(p.pos / 10)];
    c.visible = !p.out; cars.push(c); scene.add(c);

const ownedBy = (pi, type) => Object.keys(G.owner).filter(i => G.owner[i] === pi && (!type || SQ[i].t === type)).map(Number);
const groupSquares = g => SQ.map((s, i) => s.t === 'prop' && s.g === g ? i : -1).filter(i => i >= 0);
const hasMonopoly = (pi, g) => groupSquares(g).every(i => G.owner[i] === pi);
const groupHasHouses = sq => sq.t === 'prop' && groupSquares(sq.g).some(i => G.houses[i]);

function rent(i, d) {
  const sq = SQ[i], o = G.owner[i];
  if (sq.t === 'st') return 25 * 2 ** (ownedBy(o, 'st').length - 1);
  if (sq.t === 'ut') return (d[0] + d[1]) * (ownedBy(o, 'ut').length === 2 ? 10 : 4);
  const h = G.houses[i] || 0;
  return h ? sq.rent * HOUSE_MULT[h] : hasMonopoly(o, sq.g) ? sq.rent * 2 : sq.rent;
}
function liquidate(pi, need) {
  const p = G.players[pi];
  for (const i of ownedBy(pi, 'prop').filter(i => G.houses[i]).sort((a, b) => G.houses[b] - G.houses[a])) {
    while (G.houses[i] && p.money < need) { G.houses[i]--; const v = GROUPS[SQ[i].g].h / 2; p.money += v; log(`${p.name} vende una casa en ${SQ[i].name} por ${EUR(v)}.`); }
    if (!G.houses[i]) delete G.houses[i];
  }
}
function pay(pi, amount, to) {
  const p = G.players[pi];
  if (p.money < amount) liquidate(pi, amount);
  if (p.money < amount) { bankrupt(pi, to); return false; }
  p.money -= amount; if (to != null) G.players[to].money += amount;
  return true;
}
function bankrupt(pi, to) {
  const p = G.players[pi];
  log(`💀 ${p.name} está oficialmente washed y abandona el grupo.`);
  if (to != null) G.players[to].money += p.money;
  p.money = 0; p.out = true; p.inJail = false; if (cars[pi]) cars[pi].visible = false;
  for (const i of ownedBy(pi)) { delete G.houses[i]; if (to != null) G.owner[i] = to; else delete G.owner[i]; }
  const alive = G.players.filter(x => !x.out);
  if (alive.length === 1) { G.winner = alive[0].name; G.phase = 'over'; log(`🏆 ¡${alive[0].name} gana la Copa TikTok!`); }
}
async function sendJail(pi) {
  const p = G.players[pi];
  log(`🫵 ${p.name} está washed: directo a la lista.`); toast(`🫵 ${p.name}: ¡ESTÁS WASHED!`);
  await flyTo(pi, 10);
  p.pos = 10; p.inJail = true; p.jailTurns = 0; G.doubles = 0; G.lastDouble = false;
}
function passGo(p) { p.money += 200; log(`🏁 ${p.name} pasa por la Salida y cobra 200 €.`); toast(`🏁 ${p.name} +200 €`); }
async function moveBy(pi, steps, d) {
  const p = G.players[pi], from = p.pos, to = (from + steps + 40) % 40;
  await animateSteps(pi, from, steps, 190);
  if (steps > 0 && to < from) passGo(p);
  p.pos = to; renderHUD(); await land(pi, d);
}
async function moveTo(pi, target, d) {
  const p = G.players[pi], from = p.pos, steps = (target - from + 40) % 40;
  if (steps) await animateSteps(pi, from, steps, 110);
  if (steps && target < from) passGo(p);
  p.pos = target; renderHUD(); await land(pi, d);
}
async function land(pi, d) {
  const p = G.players[pi], i = p.pos, sq = SQ[i];
  showDetail(i);
  switch (sq.t) {
    case 'prop': case 'st': case 'ut': {
      const o = G.owner[i];
      if (o == null) { G.offer = i; log(`${p.name} cae en ${sq.name} (${EUR(sq.price)}).`); return; }
      if (o === pi) { log(`${p.name} cae en ${sq.name}, que ya es suya.`); return; }
      if (G.players[o].inJail) { log(`${p.name} cae en ${sq.name}, pero ${G.players[o].name} está washed y no cobra.`); return; }
      const r = rent(i, d);
      log(`💸 ${p.name} paga ${EUR(r)} a ${G.players[o].name} por ${sq.name}.`); toast(`💸 ${p.name} → ${G.players[o].name}: ${EUR(r)}`);
      pay(pi, r, o); return;
    }
    case 'tax': log(`${p.name} paga ${EUR(sq.amount)}: ${sq.name}.`); toast(`${sq.icon} ${sq.name}: −${EUR(sq.amount)}`); pay(pi, sq.amount, null); return;
    case 'ch': case 'cc': return drawCard(pi, sq.t, d);
    case 'gojail': return sendJail(pi);
    default: log(`${p.name} cae en ${sq.name}.`);
  }
}
async function drawCard(pi, type, d) {
  const p = G.players[pi], c = CARDS[type][G.decks[type][G.deckPos[type]++ % G.decks[type].length]], a = c.a;
  const dk = decks[type]; const y0 = dk.position.y;
  await tween(260, t => { dk.position.y = y0 + Math.sin(t * Math.PI) * 0.25; });
  await showCard(type, c, p.name);
  log(`${type === 'ch' ? '📊' : '🎙️'} ${p.name}: ${c.q} → ${c.fx}`);
  if (a.money > 0) { p.money += a.money; toast(`${p.name} +${EUR(a.money)}`); }
  else if (a.money < 0) pay(pi, -a.money, null);
  else if (a.each) { for (let j = 0; j < G.players.length; j++) { if (j === pi || G.players[j].out || p.out) continue; if (a.each > 0) pay(j, a.each, pi); else pay(pi, -a.each, j); } }
  else if (a.move) await moveBy(pi, a.move, d);
  else if (a.goto != null) await moveTo(pi, a.goto, d);
  else if (a.next) { let t = p.pos; do t = (t + 1) % 40; while (SQ[t].t !== a.next); await moveTo(pi, t, d); }
  else if (a.jail) await sendJail(pi);
  else if (a.free) p.free++;
  else if (a.repairs) {
    let cost = 0; for (const i of ownedBy(pi, 'prop')) { const h = G.houses[i] || 0; cost += h === 5 ? a.repairs[1] : h * a.repairs[0]; }
    if (cost) { log(`${p.name} paga ${EUR(cost)}.`); pay(pi, cost, null); } else log(`${p.name} no tiene casas: se libra.`);
  }
}

async function roll() {
  if (G.phase !== 'roll') return;
  const pi = G.turn, p = cur(), d = [1 + rand(6), 1 + rand(6)], dbl = d[0] === d[1];
  G.dice = d; await throwDice(d);
  log(`🎲 ${p.name} saca ${d[0]} + ${d[1]}${dbl ? ' (dobles)' : ''}.`);
  if (p.inJail) {
    if (dbl) { p.inJail = false; p.jailTurns = 0; log(`${p.name} sale de la lista con dobles.`); await moveBy(pi, d[0] + d[1], d); return after(false); }
    if (++p.jailTurns >= 3) {
      log(`${p.name} paga 50 € para salir de la lista.`);
      if (!pay(pi, 50, null)) return after(false);
      p.inJail = false; p.jailTurns = 0; await moveBy(pi, d[0] + d[1], d); return after(false);
    }
    log(`${p.name} sigue washed (${p.jailTurns}/3).`); return after(false);
  }
  if (dbl && ++G.doubles === 3) { log('Tres dobles seguidos: muy sospechoso.'); await sendJail(pi); return after(false); }
  await moveBy(pi, d[0] + d[1], d);
  after(dbl);
}
function after(dbl) {
  G.lastDouble = dbl;
  if (G.phase === 'over') return;
  if (cur().out) G.phase = 'end';
  else if (G.offer != null) G.phase = 'buy';
  else G.phase = dbl && !cur().inJail ? 'roll' : 'end';
  if (G.phase === 'roll') log(`${cur().name} vuelve a tirar.`);
}
function buy(yes) {
  const i = G.offer, sq = SQ[i], p = cur();
  if (yes && p.money >= sq.price) { p.money -= sq.price; G.owner[i] = G.turn; log(`🏠 ${p.name} compra ${sq.name} por ${EUR(sq.price)}.`); toast(`🏠 ${p.name} compra ${sq.name}`); }
  else log(`${p.name} pasa de ${sq.name}.`);
  G.offer = null;
  G.phase = G.lastDouble && !p.inJail ? 'roll' : 'end';
  if (G.phase === 'roll') log(`${p.name} vuelve a tirar.`);
}
function endTurn() {
  G.doubles = 0; G.lastDouble = false; buildOpen = false;
  do G.turn = (G.turn + 1) % G.players.length; while (G.players[G.turn].out);
  G.phase = 'roll'; log(`— Turno de ${cur().name}.`);
}
function payJail() {
  const p = cur();
  if (p.free) { p.free--; log(`${p.name} usa la Garantía EFS y sale de la lista.`); }
  else { if (p.money < 50) return; p.money -= 50; log(`${p.name} paga 50 € y sale de la lista.`); }
  p.inJail = false; p.jailTurns = 0;
}
function build(i, delta) {
  const p = cur(), sq = SQ[i], cost = GROUPS[sq.g].h, h = G.houses[i] || 0;
  if (delta > 0) {
    if (h >= 5 || p.money < cost || !hasMonopoly(G.turn, sq.g)) return;
    p.money -= cost; G.houses[i] = h + 1; log(`🔨 ${p.name} construye ${h + 1 === 5 ? 'un garitaso' : 'una casa'} en ${sq.name}.`);
  } else if (h) {
    p.money += cost / 2; G.houses[i] = h - 1; if (!G.houses[i]) delete G.houses[i]; log(`${p.name} vende una casa en ${sq.name}.`);
  }
}

async function act(fn) {
  if (busy || !G) return;
  busy = true; renderHUD();
  try { await fn(); } catch (e) { console.error(e); }
  busy = false; save(); syncBuildings(); renderHUD();
  if (G.winner && !winnerShown) { winnerShown = true; showWinner(); }
}

/* =========================================================
   INTERFAZ
   ========================================================= */
function modal(html, buttons) {
  return new Promise(res => {
    $('#mbox').innerHTML = html + `<div class="row" style="margin-top:14px;justify-content:flex-end">${buttons.map((b, k) => `<button data-k="${k}" class="${b.primary ? 'primary' : ''}">${esc(b.label)}</button>`).join('')}</div>`;
    $('#modal').hidden = false;
    $('#mbox').querySelectorAll('button[data-k]').forEach(el => el.onclick = () => {
      const b = buttons[+el.dataset.k]; if (b.check && !b.check()) return;
      const v = typeof b.value === 'function' ? b.value() : b.value; $('#modal').hidden = true; res(v);
    });
    $('#mbox').querySelector('button.primary')?.focus();
  });
}
function showCard(type, c, who) {
  const col = type === 'ch' ? '#6b2fb3' : '#0f8a55';
  return modal(`<div class="gcard"><div class="hd" style="background:${col}">${type === 'ch' ? '📊 POLL' : '🎙️ AUDIO DE NANOCASAS'}<span style="margin-left:auto;font-weight:600;opacity:.85">${esc(who)}</span></div>
    <div class="bd"><div style="font-size:1.05rem;font-style:italic">${esc(c.q)}</div><div class="fx">${esc(c.fx)}</div></div></div>`, [{ label: 'Vale', value: true, primary: true }]);
}
function showWinner() {
  const w = G.players.find(p => !p.out);
  modal(`<div style="text-align:center;font-size:3rem">🏆</div><div class="winner">${esc(G.winner)} gana la Copa TikTok</div>
    <p class="muted" style="text-align:center">Todos los demás están washed. Ganaré, ganaré…</p>
    <p style="text-align:center"><strong>${EUR(w?.money || 0)}</strong> · ${ownedBy(G.players.indexOf(w)).length} propiedades</p>`,
    [{ label: 'Nueva partida', value: 'new', primary: true }, { label: 'Ver tablero', value: 'stay' }]).then(v => { if (v === 'new') setup(); });
  camTo(new THREE.Vector3(5, 5, 3), new THREE.Vector3(3, 0.5, -3), 1400);
}

function renderHUD() {
  if (!G) return;
  const p = cur();
  $('#turn').innerHTML = G.winner
    ? `<span class="chip" style="background:#e7b416"></span><strong>🏆 ${esc(G.winner)} gana</strong>`
    : `<span class="chip" style="background:${p.color}"></span><div style="min-width:0"><div class="small muted">Turno de · ${esc(p.team)}</div><strong>${esc(p.name)}</strong>${p.inJail ? ' <span class="small">· 🧺 washed</span>' : ''}</div><span class="money">${EUR(p.money)}</span>`;
  const A = [], dis = busy ? 'disabled' : '';
  if (G.phase === 'roll') {
    A.push(`<button class="primary" data-act="roll" ${dis}>🎲 Tirar dados</button>`);
    if (p.inJail) A.push(`<button data-act="jail" ${dis || (!p.free && p.money < 50 ? 'disabled' : '')}>${p.free ? 'Usar Garantía EFS' : 'Pagar 50 € y salir'}</button>`);
  } else if (G.phase === 'buy') {
    const sq = SQ[G.offer];
    A.push(`<button class="primary" data-act="buy" ${dis || (p.money < sq.price ? 'disabled' : '')}>Comprar · ${EUR(sq.price)}</button>`, `<button data-act="pass" ${dis}>Pasar</button>`);
  } else if (G.phase === 'end') A.push(`<button class="primary" data-act="end" ${dis}>Terminar turno ➜</button>`);
  else if (G.phase === 'over') A.push(`<button class="primary" data-act="new">Nueva partida</button>`);
  const canBuild = !G.winner && G.phase !== 'buy' && GROUPS.some((_, g) => hasMonopoly(G.turn, g));
  if (canBuild) A.push(`<button data-act="build" ${dis}>${buildOpen ? 'Cerrar obras' : '🔨 Construir'}</button>`);
  $('#actions').innerHTML = A.join('');

  const bb = $('#buildbox'); bb.hidden = !(canBuild && buildOpen);
  if (!bb.hidden) {
    bb.innerHTML = `<div class="small muted" style="margin-top:10px">4 casas → garitaso · vender devuelve la mitad</div>` + GROUPS.flatMap((_, g) => hasMonopoly(G.turn, g) ? groupSquares(g) : []).map(i => {
      const sq = SQ[i], h = G.houses[i] || 0, cost = GROUPS[sq.g].h;
      return `<div class="it"><i class="sw" style="background:${GROUPS[sq.g].c}"></i><span>${esc(sq.name)} · ${h === 5 ? 'garitaso' : h + ' 🏠'}</span>
        <button data-b="${i}" data-d="-1" ${!h || busy ? 'disabled' : ''}>−</button><button data-b="${i}" data-d="1" ${h >= 5 || p.money < cost || busy ? 'disabled' : ''}>+${cost} €</button></div>`;
    }).join('');
  }
  $('#players').innerHTML = G.players.map((pl, k) => `<div class="pl${k === G.turn && !G.winner ? ' active' : ''}${pl.out ? ' out' : ''}">
    <span class="chip" style="background:${pl.color};width:16px;height:16px"></span><span class="nm" title="${esc(pl.name)} · ${esc(pl.team)}">${esc(pl.name)}</span>
    <span class="small muted">${ownedBy(k).length} 🏠${pl.free ? ' · 🎟️' : ''}${pl.inJail ? ' · 🧺' : ''}</span><span class="mn">${EUR(pl.money)}</span></div>`).join('');
  $('#log').innerHTML = G.log.map(t => `<div>${esc(t)}</div>`).join('');
  if (detailIdx != null) showDetail(detailIdx, true);
}
function showDetail(i, quiet) {
  detailIdx = i; if (!quiet) markSquare(i);
  const sq = SQ[i], o = G?.owner[i], h = G?.houses[i] || 0;
  let body = `<p class="quote">${esc(sq.sub || '')}</p>`;
  if (sq.t === 'prop') {
    body += `<div class="small muted" style="margin-bottom:4px">Grupo: ${esc(GROUPS[sq.g].name)}</div><table>
      <tr><td>Precio</td><td>${EUR(sq.price)}</td></tr><tr><td>Alquiler</td><td>${EUR(sq.rent)} (×2 con el grupo)</td></tr>
      ${[1, 2, 3, 4].map(k => `<tr><td>Con ${k} casa${k > 1 ? 's' : ''}</td><td>${EUR(sq.rent * HOUSE_MULT[k])}</td></tr>`).join('')}
      <tr><td>Con garitaso</td><td>${EUR(sq.rent * HOUSE_MULT[5])}</td></tr><tr><td>Cada casa</td><td>${EUR(GROUPS[sq.g].h)}</td></tr></table>`;
  } else if (sq.t === 'st') body += `<p class="small">Circuito · ${EUR(200)}. Alquiler 25 / 50 / 100 / 200 € según cuántos circuitos tenga el dueño.</p>`;
  else if (sq.t === 'ut') body += `<p class="small">Servicio · ${EUR(150)}. Alquiler: dados × 4 (× 10 con los dos).</p>`;
  else if (sq.t === 'tax') body += `<p class="small">Pagas ${EUR(sq.amount)} a la banca.</p>`;
  if (o != null) body += `<p class="small" style="margin-top:8px">Dueño: <strong>${esc(G.players[o].name)}</strong>${h ? ` · ${h === 5 ? 'garitaso' : h + ' casas'}` : ''}</p>`;
  if (G && o != null && o !== G.turn && !G.winner && G.phase !== 'buy' && !busy && !h && !groupHasHouses(sq) && !G.players[o].out)
    body += `<button data-offer="${i}" style="margin-top:6px">🤝 Ofrecer compra a ${esc(G.players[o].name)}</button>`;
  $('#detail').innerHTML = `${sq.t === 'prop' ? `<div class="band" style="background:${GROUPS[sq.g].c}"></div>` : ''}<h3>${esc(sq.icon)} ${esc(sq.name)}</h3>${body}`;
}
async function offer(i) {
  const sq = SQ[i], o = G.owner[i], p = cur(), seller = G.players[o];
  const amount = await modal(`<h2>🤝 Oferta por ${esc(sq.name)}</h2><p class="small muted">${esc(p.name)} ofrece a ${esc(seller.name)}. Tienes ${EUR(p.money)}.</p>
    <input id="offer-amt" type="number" min="1" max="${p.money}" value="${Math.min(p.money, sq.price)}" inputmode="numeric">`,
    [{ label: 'Cancelar', value: null }, { label: 'Ofrecer', primary: true, value: () => Math.floor(+$('#offer-amt').value), check: () => { const n = Math.floor(+$('#offer-amt').value); return n > 0 && n <= p.money; } }]);
  if (!amount) return;
  const ok = await modal(`<h2>${esc(seller.name)}, te hacen una oferta</h2><p>${esc(p.name)} te ofrece <strong>${EUR(amount)}</strong> por <strong>${esc(sq.name)}</strong>.</p>`,
    [{ label: 'Rechazar', value: false }, { label: 'Aceptar', value: true, primary: true }]);
  if (ok) { p.money -= amount; seller.money += amount; G.owner[i] = G.turn; log(`🤝 ${p.name} compra ${sq.name} a ${seller.name} por ${EUR(amount)}.`); }
  else log(`${seller.name} rechaza vender ${sq.name}.`);
  save(); syncBuildings(); renderHUD();
}

$('#actions').onclick = e => {
  const a = e.target.closest('button')?.dataset.act; if (!a) return;
  if (a === 'roll') act(roll);
  else if (a === 'buy') act(async () => buy(true));
  else if (a === 'pass') act(async () => buy(false));
  else if (a === 'end') act(async () => endTurn());
  else if (a === 'jail') act(async () => payJail());
  else if (a === 'build') { buildOpen = !buildOpen; renderHUD(); }
  else if (a === 'new') setup();
};
$('#buildbox').onclick = e => { const b = e.target.closest('button[data-b]'); if (b) act(async () => build(+b.dataset.b, +b.dataset.d)); };
$('#detail').onclick = e => { const b = e.target.closest('button[data-offer]'); if (b && !busy) offer(+b.dataset.offer); };
$('#b-new').onclick = async () => {
  if (G && !G.winner && !(await modal('<h2>¿Nueva partida?</h2><p>Se perderá la partida actual.</p>', [{ label: 'Cancelar', value: false }, { label: 'Sí, empezar otra', value: true, primary: true }]))) return;
  setup();
};

/* --- Configuración inicial --- */
async function setup(allowContinue) {
  const saved = allowContinue ? store.get(SAVE_KEY) : null;
  G = null; winnerShown = false; cars.forEach(c => scene.remove(c)); cars.length = 0; syncBuildings(); selMark.visible = false;
  $('#turn').innerHTML = '<strong>Elige jugadores para empezar</strong>'; $('#actions').innerHTML = ''; $('#players').innerHTML = ''; $('#log').innerHTML = '';
  camTo(HOME_CAM.clone(), new THREE.Vector3(0, 0, 0), 600);
  let picked = ['NanoCasas', 'Del Rio', 'X', 'Cierta Persona'];
  const html = () => `<div class="setup"><h1>🕷️ Quexinopoly</h1>
    <p class="muted">El Monopoly del grupo QUEXINES, en 3D. Ruta desde los Olivos de Tornado hasta la Villa Jávea, pasando por la Charca, el Imperio EFS y las Oficinas de Motorsportive.</p>
    <div class="lore">${['🏝️ Villa Jávea', '🍻 El Garitaso', '🏁 Motorsportive', '🏢 EFS', '🎙️ UADB', '🐸 Charca', '🧺 Lista de Washed', '🏆 Copa TikTok'].map(t => `<span>${t}</span>`).join('')}</div>
    <h3>Jugadores (2–6) · cada uno lleva un F1</h3>
    <div class="pick" id="pick">${[...new Set([...MEMBERS, ...picked])].map(n => `<label><input type="checkbox" value="${esc(n)}" ${picked.includes(n) ? 'checked' : ''}> ${esc(n)}</label>`).join('')}</div>
    <div class="row"><input id="addn" type="text" placeholder="Añadir otro jugador" style="flex:1"><button id="addb">Añadir</button></div>
    <p id="perr" class="small" style="color:var(--danger);min-height:1.2em;margin:8px 0 0"></p></div>`;
  const buttons = [];
  if (saved && saved.players && !saved.winner) buttons.push({ label: 'Continuar partida', value: 'continue' });
  buttons.push({ label: 'Empezar partida', value: 'start', primary: true, check: () => { if (picked.length < 2) { $('#perr').textContent = 'Necesitáis al menos 2 jugadores.'; return false; } return true; } });
  const p = modal(html(), buttons);
  const wire = () => {
    $('#pick').onchange = e => {
      const n = e.target.value;
      if (e.target.checked) { if (picked.length >= 6) { e.target.checked = false; $('#perr').textContent = 'Máximo 6 jugadores.'; return; } picked.push(n); }
      else picked = picked.filter(x => x !== n);
      $('#perr').textContent = '';
    };
    $('#addb').onclick = () => {
      const n = $('#addn').value.trim(); if (!n) return;
      if (picked.length >= 6) { $('#perr').textContent = 'Máximo 6 jugadores.'; return; }
      if (!picked.includes(n)) picked.push(n);
      const lab = document.createElement('label'); lab.innerHTML = `<input type="checkbox" value="${esc(n)}" checked> ${esc(n)}`; $('#pick').appendChild(lab); $('#addn').value = '';
    };
    $('#addn').onkeydown = e => { if (e.key === 'Enter') $('#addb').click(); };
  };
  wire();
  const v = await p;
  if (v === 'continue') G = saved;
  else { G = newGame(shuffle(picked.slice())); log(`Arranca Quexinopoly. Parrilla: ${G.players.map(x => `${x.name} (${x.team})`).join(', ')}.`); log(`— Turno de ${G.players[0].name}.`); }
  buildCars(); syncBuildings(); save(); renderHUD(); showDetail(cur().pos);
  camTo(new THREE.Vector3(3.5, 8.5, 10.5), new THREE.Vector3(1.5, 0, 1.5), 1200);
}
setup(true);
window.__q = { get G() { return G; }, set speed(v) { SPEED = v; } };
</script>
</body>
